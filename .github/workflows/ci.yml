name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macOS 15 is the minimum declared in Package.swift: if it builds
    # here, it builds on the target machine.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release, host architecture)
        run: swift build -c release

      - name: Supervisor suite (needs a real Pi install)
        # 27 checks over the process supervisor, including the invariant that
        # matters: never reap an instance that is busy. It launches a real
        # `pi`, so it cannot run where there is none — and the honest move is
        # to say so instead of skipping silently or failing for a reason that
        # is not a defect.
        run: |
          if command -v pi >/dev/null 2>&1; then
            ./.build/release/p4w-supervisor
          else
            echo "No pi on this machine."
            echo "The supervisor suite launches a real one, so it is skipped."
            echo "It runs locally, together with --self-check."
          fi

      - name: The cat and the icon are code, so they verify here
        run: |
          ./.build/release/P4W --render-cat
          ./.build/release/P4W --render-icon
          ls -la dist/cat/*.png | head -3
          ls -la dist/icon/P4W.icns

      - name: Dependency check reports instead of breaking
        # There is no `pi` on a runner. The point is that the check
        # *says what is missing* rather than failing.
        run: |
          ./.build/release/P4W --check-deps || true
          ./.build/release/P4W --check-deps | grep -q obligatorio

  release:
    # Verifies the thing people actually download, which is worth more than
    # rebuilding it here.
    #
    # A multi-architecture `swift build --arch arm64 --arch x86_64` is *not*
    # in this workflow, on purpose: on the runner's toolchain it stops with
    # "duplicate output file … normal x86_64" and "missing target configuration
    # for 'P4WCore'", writing its intermediates into the package root. It
    # happens on a clean runner too, so it is not build history, and a separate
    # scratch path does not help. It works on the machine releases are cut on,
    # and the artifact it produces is what this job checks.
    runs-on: macos-15
    steps:
      - name: Download the latest release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --dir /tmp/p4w
          ls -la /tmp/p4w

      - name: Universal, signed and notarized — what a user gets
        run: |
          DMG="$(ls /tmp/p4w/*.dmg | head -1)"
          hdiutil attach "$DMG" -nobrowse -readonly
          APP="$(ls -d /Volumes/P4W*/P4W.app | head -1)"
          echo "app: $APP"

          echo "── architectures ──"
          lipo -archs "$APP/Contents/MacOS/P4W"
          lipo -archs "$APP/Contents/MacOS/P4W" | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/P4W" | grep -q arm64

          echo "── minimum OS version, on each slice ──"
          test "$(vtool -show-build "$APP/Contents/MacOS/P4W" \
            | grep -c 'minos 15.0')" -ge 2
          vtool -show-build "$APP/Contents/MacOS/P4W" | grep minos

          echo "── signature ──"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier"
          codesign --verify --strict "$APP"

          echo "── Gatekeeper ──"
          # This checks Apple's record, so it needs the network: a notarized app
          # is accepted, an unsigned one is not.
          spctl --assess --type execute -vvv "$APP" | grep -E "accepted|source"

          echo "── the image has its ticket ──"
          xcrun stapler validate "$DMG"

          hdiutil detach "${APP%/P4W.app}" >/dev/null
