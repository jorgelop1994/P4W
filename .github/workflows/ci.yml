name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macOS 15 es el mínimo declarado en Package.swift: si compila acá, compila en la máquina objetivo.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build universal (release, arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Verify the universal binary
        run: |
          BIN=".build/out/Products/Release/P4W"
          echo "archs: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q x86_64
          lipo -archs "$BIN" | grep -q arm64
          vtool -show-build "$BIN" | grep -q "minos 15.0"

      - name: Supervisor suite
        run: ./.build/release/p4w-supervisor

      - name: Art the cat is drawn in code, so it can be verified here
        run: |
          ./.build/release/P4W --render-cat
          ./.build/release/P4W --render-icon
          ls -la dist/cat dist/icon

      - name: Dependency check runs and reports
        # Sin `pi` en el runner: no puede pasar, pero sí tiene que **decir qué falta** en vez de romperse.
        run: ./.build/release/P4W --check-deps || true
