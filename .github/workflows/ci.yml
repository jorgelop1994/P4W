name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macOS 15 is the minimum declared in Package.swift: if it builds
    # here, it builds on the target machine.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release, host architecture)
        run: swift build -c release

      - name: Supervisor suite (needs a real Pi install)
        # 27 checks over the process supervisor, including the invariant that
        # matters: never reap an instance that is busy. It launches a real
        # `pi`, so it cannot run where there is none — and the honest move is
        # to say so instead of skipping silently or failing for a reason that
        # is not a defect.
        run: |
          if command -v pi >/dev/null 2>&1; then
            ./.build/release/p4w-supervisor
          else
            echo "No pi on this machine."
            echo "The supervisor suite launches a real one, so it is skipped."
            echo "It runs locally, together with --self-check."
          fi

      - name: The cat and the icon are code, so they verify here
        run: |
          ./.build/release/P4W --render-cat
          ./.build/release/P4W --render-icon
          ls -la dist/cat/*.png | head -3
          ls -la dist/icon/P4W.icns

      - name: Dependency check reports instead of breaking
        # There is no `pi` on a runner. The point is that the check
        # *says what is missing* rather than failing.
        run: |
          ./.build/release/P4W --check-deps || true
          ./.build/release/P4W --check-deps | grep -q obligatorio

  universal:
    # Its own runner, and that is the whole point: a universal build has to be
    # the first build in a workspace. Run after a host build, the build system
    # emits duplicate outputs for the second architecture and stops with
    # "duplicate output file … normal x86_64". A separate scratch path did not
    # help — it writes the intermediates into the package root anyway.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for both architectures
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Both slices, and the same minimum on each
        run: |
          BIN="$(find .build -type f -path '*Products/Release/P4W' | head -1)"
          echo "binary: $BIN"
          test -n "$BIN"
          echo "archs: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q x86_64
          lipo -archs "$BIN" | grep -q arm64
          # An app that runs on arm64 and needs a newer macOS on Intel is not
          # a universal app, so each slice has to declare the minimum.
          test "$(vtool -show-build "$BIN" | grep -c 'minos 15.0')" -ge 2
          vtool -show-build "$BIN" | grep -E "minos|platform"
